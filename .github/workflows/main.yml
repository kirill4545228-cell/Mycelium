name: Build Fabric mod

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Locate or unpack mod source
        id: source
        shell: bash
        run: |
          if [ -f build.gradle ]; then
            PROJECT_DIR="."
          else
            ARCHIVE="$(find . -maxdepth 1 -type f -iname '*.zip' -print -quit)"
            if [ -z "$ARCHIVE" ]; then
              echo "No build.gradle or ZIP archive found at repository root." >&2
              exit 1
            fi
            mkdir -p _mod_source
            unzip -oq "$ARCHIVE" -d _mod_source
            PROJECT_FILE="$(find _mod_source -type f -name build.gradle -print -quit)"
            if [ -z "$PROJECT_FILE" ]; then
              echo "The uploaded ZIP does not contain a Gradle project." >&2
              exit 1
            fi
            PROJECT_DIR="$(dirname "$PROJECT_FILE")"
          fi
          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle 8.6
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.6'
      - name: Build mod
        run: gradle -p "${{ steps.source.outputs.project_dir }}" build
      - name: Upload mod jar
        uses: actions/upload-artifact@v4
        with:
          name: mushroom-mobs-fabric-1.20.1
          path: ${{ steps.source.outputs.project_dir }}/build/libs/*-1.0.0.jar
          if-no-files-found: error
